name: Metrics
on:
  # Schedule daily updates at midnight UTC
  schedule: [{cron: "0 0 * * *"}]
  # Allow workflow to be manually triggered
  workflow_dispatch:
  # Run on push to main
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate GitHub Metrics Dashboard
        uses: lowlighter/metrics@latest
        with:
          # Your GitHub token
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}

          # Options
          user: ayanarshad
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Karachi
          config_order: base.header, isocalendar, habits, pagespeed, languages, topics

          # PageSpeed Insights
          plugin_pagespeed: yes
          plugin_pagespeed_url: https://aaportfolio.pages.dev
          plugin_pagespeed_token: ${{ secrets.PAGESPEED_TOKEN }}

          # Isometric 3D Contributions Calendar (Matches screenshot)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # Coding Habits and Commit Activity Charts (Matches screenshot)
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          # Most Used Languages (Matches screenshot)
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%

          # Mastered Technologies and Topics Icons (Matches screenshot)
          plugin_topics: yes
          plugin_topics_limit: 15
          plugin_topics_mode: icons
          plugin_topics_sort: stars

          # Output
          filename: github-metrics.svg
          output_action: commit
          committer_message: "chore: update futuristic github metrics dashboard [skip ci]"
